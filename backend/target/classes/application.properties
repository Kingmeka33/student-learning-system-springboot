spring.application.name=student-learning-system
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_DATABASE:student_learning_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password1234}

# Production-aware setup: Flyway manages the schema, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:kingmeka1234kingmeka1234kingmeka1234kingmeka1234}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
frontend.url=${FRONTEND_URL:http://localhost:5173}
server.port=${PORT:3000}

# Allows Flyway to baseline an existing non-empty database schema.
spring.flyway.baseline-on-migrate=true
